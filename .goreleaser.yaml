version: 2

project_name: scanchat

before:
  hooks:
    - sh -c "cd web && npm ci && npm run build"

builds:
  - main: .
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

release:
  draft: true
