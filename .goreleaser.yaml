version: 2

project_name: llmbeam

before:
  hooks:
    - sh -c "cd web && npm ci && npm run build"

builds:
  - id: llmbeam
    main: .
    binary: llmbeam
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: llmbeam
    ids:
      - llmbeam
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

homebrew_casks:
  - name: llmbeam
    ids:
      - llmbeam
    repository:
      owner: llmbeam
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/llmbeam/llmbeam
    description: Beam local LLMs to your phone with one command and one scan
    binaries:
      - llmbeam
    url:
      verified: github.com/llmbeam/llmbeam/releases/download

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: llmbeam
    name: llmbeam
  draft: false
