name: deploy remote page

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "remote-web/**"
      - "web/package.json"
      - "web/package-lock.json"
      - "web/public/**"
      - "web/src/**"
      - "web/tsconfig*.json"
      - "web/vite.remote.config.ts"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: tailscale/tailcat
          ref: ce6fedcabc220bab3b94d470ab330219111eeae8
          path: tailcat

      - uses: actions/setup-go@v5
        with:
          go-version-file: tailcat/go.mod
          cache: false

      - name: Build Tailcat WASM
        working-directory: tailcat
        run: go run ./cmd/tailcat-webdist -o ../tailcat-pages

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build LLMBeam Connect page
        working-directory: web
        run: npm run build:remote

      - name: Add Tailcat runtime
        run: |
          cp tailcat-pages/main.wasm.gz dist/remote-web/main.wasm.gz
          cp tailcat-pages/wasm_exec.js dist/remote-web/wasm_exec.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/remote-web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
