name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: git diff --exit-code -- internal/ui/dist
      - run: go vet ./...
      - run: go test -race ./...
